events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 🛡️ Diretivas básicas de segurança (Cabeçalhos HTTP obrigatórios na rubrica)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 🔄 Redirecionamento automático de HTTP (porta 80) para HTTPS (porta 443)
    server {
        listen 80;
        server_name meuapp.local;
        return 301 https://$host$request_uri;
    }

    # 🔐 Configuração do ambiente seguro via HTTPS (porta 443)
    server {
        listen 443 ssl;
        server_name meuapp.local;

        # Certificados locais que vamos gerar depois com o mkcert
        ssl_certificate /etc/nginx/certs/meuapp.local.pem;
        ssl_certificate_key /etc/nginx/certs/meuapp.local-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 🔀 Proxy Reverso para o Frontend (React rodando no container)
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 🔀 Proxy Reverso para o Backend (API Node.js rodando no container)
        location /api {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}