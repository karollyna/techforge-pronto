version: '3.8'

services:
  # 🗄️ Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: techforge_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - techforge_network

  # 🔴 Cache e Mensageria (Redis) - Requisito da nova rubrica
  redis:
    image: redis:alpine
    container_name: techforge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - techforge_network

  # 🟢 API Backend (Node.js + Prisma)
  backend:
    build: ./backend
    container_name: techforge_backend
    restart: always
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - techforge_network

  # 🔵 Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: techforge_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - techforge_network

  # 🛡️ Nginx (O único exposto para fora do container)
  nginx:
    image: nginx:alpine
    container_name: techforge_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - techforge_network

# Volumes nomeados para MySQL e Redis
volumes:
  mysql_data:
  redis_data:

# Rede isolada
networks:
  techforge_network:
    driver: bridge